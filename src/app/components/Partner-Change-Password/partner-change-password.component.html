<app-partner-shell activeMenu="change-password">
  <div class="container-fluid">
    <app-loader *ngIf="isLoading"></app-loader>

    <div class="row">
      <div class="col-md-12">
        <div class="card shadow-sm">
          <div class="card-header bg-gradient-indigo text-white">
            <strong><i class="bi bi-key"></i> CHANGE PASSWORD</strong>
          </div>
          <div class="card-body">
            <div class="row">
              <div class="col-md-4 form-group">
                <label class="form-label d-flex align-items-center">
                  <i class="bi bi-person form-icon icon-label"></i> User Name
                </label>
                <input type="text" class="form-control disablecss" [(ngModel)]="name" readonly />
              </div>

              <div class="col-md-4 form-group">
                <label class="form-label d-flex align-items-center">
                  <i class="bi bi-credit-card-2-front form-icon icon-label"></i> Aadhar Number
                </label>
                <input
                  type="text"
                  maxlength="12"
                  class="form-control"
                  [class.is-invalid]="showInputAadharError"
                  placeholder="Enter Aadhar Number"
                  [(ngModel)]="inputAadhar"
                  (keypress)="($event.charCode >= 48 && $event.charCode <= 57) ? true : $event.preventDefault()" />
              </div>

              <div class="col-md-4 form-group">
                <label class="form-label d-flex align-items-center">
                  <i class="bi bi-credit-card-2-front form-icon icon-label"></i> PAN Number
                </label>
                <input
                  type="text"
                  maxlength="10"
                  class="form-control"
                  [class.is-invalid]="showInputPanError"
                  placeholder="Enter PAN Number"
                  [(ngModel)]="inputPanNumber" />
              </div>

              <div class="mt-3 text-left">
                <button class="btn btn-chandan btn-sm" type="button" (click)="validateUser()">
                  <i class="bi bi-check-circle"></i> VALIDATE USER INFO
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <ng-template #previewModal let-modal>
      <div class="modal-header bg-purple text-white">
        <h5 class="modal-title">Change Password - Instant Pay</h5>
      </div>

      <div class="modal-body">
        <table class="table table-bordered text-center small">
          <thead class="bg-purple text-white">
            <tr>
              <th>Customer Name</th>
              <th>Phone Number</th>
              <th>Aadhar No</th>
              <th>PAN Number</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>{{ name }}</td>
              <td>{{ phoneNo }}</td>
              <td>{{ aadharNo }}</td>
              <td>{{ panNo }}</td>
            </tr>
          </tbody>
        </table>

        <div class="row">
          <div class="col-md-6 form-group">
            <label class="form-label d-flex align-items-center">
              <i class="bi bi-key icon-label me-1"></i> Current Password
            </label>
            <div class="input-group">
              <input
                [type]="showCurrentPassword ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="currentPassword"
                placeholder="Enter Current Password"
                autocomplete="off" />
              <span class="input-group-text cursor-pointer" (click)="showCurrentPassword = !showCurrentPassword">
                <i class="bi" [ngClass]="showCurrentPassword ? 'bi-eye' : 'bi-eye-slash'"></i>
              </span>
            </div>
          </div>

          <div class="col-md-6 form-group">
            <label class="form-label d-flex align-items-center">
              <i class="bi bi-key icon-label me-1"></i> New Password
            </label>
            <div class="input-group">
              <input
                [type]="showNewPassword ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="newPassword"
                placeholder="Enter New Password"
                autocomplete="off" />
              <span class="input-group-text cursor-pointer" (click)="showNewPassword = !showNewPassword">
                <i class="bi" [ngClass]="showNewPassword ? 'bi-eye' : 'bi-eye-slash'"></i>
              </span>
            </div>
          </div>

          <div class="col-md-6 form-group">
            <label class="form-label d-flex align-items-center">
              <i class="bi bi-key form-icon icon-label"></i> Confirm Password
            </label>
            <div class="input-group">
              <input
                [type]="showConfirmPassword ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="confirmPassword"
                placeholder="Enter Confirm Password"
                autocomplete="off" />
              <span class="input-group-text cursor-pointer" (click)="showConfirmPassword = !showConfirmPassword">
                <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye' : 'bi-eye-slash'"></i>
              </span>
            </div>
          </div>

          <div class="col-md-6 form-group">
            <label><i class="bi bi-shield-lock"></i> OTP</label>
            <div class="input-group">
              <input
                type="text"
                [(ngModel)]="otp"
                maxlength="4"
                style="max-width: 75% !important;"
                class="form-control"
                placeholder="Enter OTP"
                autocomplete="one-time-code" />
              &nbsp;&nbsp;
              <button class="btn btn-success btn-sm" type="button" (click)="resendOtp()">Resend OTP</button>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer d-flex justify-content-between flex-wrap">
        <button class="btn btn-outline-secondary btn-sm flex-grow-1 me-2 mb-2" type="button" (click)="cancel()">
          Cancel
        </button>
        <button class="btn btn-chandan btn-sm flex-grow-1 mb-2" type="button" (click)="updatePassword()">
          <i class="bi bi-check-circle"></i> Confirm & Proceed
        </button>
      </div>
    </ng-template>
  </div>
</app-partner-shell>
