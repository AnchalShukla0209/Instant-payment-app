<!-- Warning message -->
<!-- Warning message 30 sec before lock -->
<div *ngIf="warningSeconds && !showUnlock" class="warning-modal">
  ⚠️ Screen will lock in {{ warningSeconds }} seconds due to inactivity.
</div>

<!-- Unlock popup -->
<app-unlock *ngIf="showUnlock" (unlocked)="onUnlocked()"></app-unlock>

<app-loader *ngIf="globalLoader.loading$ | async"></app-loader>

<router-outlet></router-outlet>
